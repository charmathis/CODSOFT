<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="theme-switcher">
  <button id="neon">Neon</button>
  <button id="glass">Glass</button>
  <button id="pastel">Pastel</button>
</div>
<div class="calculator">
  <div id="history">
    <h3>History</h3>
    <ul id="historyList"></ul>
  </div>
  <div id="display">0</div>
  <button id="copy">Copy Result</button>
  <div class="buttons">
      <button data="AC">AC</button>
      <button data="DEL">DEL</button>
      <button data="%">%</button>
      <button data="/">÷</button>
      <button data="7">7</button>
      <button data="8">8</button>
      <button data="9">9</button>
      <button data="*">×</button>
      <button data="4">4</button>
      <button data="5">5</button>
      <button data="6">6</button>
      <button data="-">−</button>
      <button data="1">1</button>
      <button data="2">2</button>
      <button data="3">3</button>
      <button data="+">+</button>
      <button class="zero" data="0">0</button>
      <button data=".">.</button>
      <button class="equal" data="=">=</button>
      <button data="Math.sin(">sin</button>
      <button data="Math.cos(">cos</button>
      <button data="Math.tan(">tan</button>
      <button data="Math.sqrt(">√</button>
  </div>
</div>
<audio id="clickSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5ba9a9c3cc.mp3?filename=click-124467.mp3"></audio>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</body>
</html>
